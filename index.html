# Part 1
## 程式語言的發展

----

## 三種語言層次

```
高階語言  →  C++, Python, Java ...
              ↓ 編譯
組合語言  →  add 2, 3, result
              ↓ 組譯
機器語言  →  01001011 10110100 ...
```

----

## Machine Language 機器語言

- 僅由 **0 和 1** 組成
- 代表電路的高低電位
- 電腦**唯一看得懂**的語言
- 缺點：
  - 可讀性極差
  - 不同機器有不同指令集

----

## Assembly Language 組合語言

用**助憶碼 mnemonic** 代替機器指令

```assembly
add 2, 3, result
```

- 建置「組譯器」負責轉換
- 可在不同平台移植
- 大幅簡化開發過程

----

## High-level Language 高階語言

現在大多數語言都屬於高階語言：

| 語言 | 特性 |
|------|------|
| C | 貼近硬體，效能高 |
| C++ | 支援 OOP，較易理解 |
| Python | 語法簡潔，開發快速 |
| Java | 跨平台，企業應用 |

----

## C vs C++

| | C | C++ |
|---|---|---|
| 層次 | 低階語言之間 | 高階語言 |
| 難度 | 較生澀 | 較易理解 |
| OOP | N | Y |
| 關係 | 基礎 | 建立在 C 之上 |

> C++ 可以直接使用 C 的 header！

----

# Part 2
## Source Code → 執行檔

----

## 四個步驟

```
Source Code (.cpp)
      ↓  1. 預先處理 Preprocessing
Preprocessed Code
      ↓  2. 編譯 Compilation
Assembly Code
      ↓  3. 組譯 Assembly
Object File (.o)
      ↓  4. 連結 Linking
Executable (.exe / .out)
```

----

## 各步驟說明

**1 預先處理**
- 抓取 `#include` 的 header 內容
- 展開 `#define` 的替換
- 組合成單一檔案

**2 編譯**
- 語法檢查
- 優化並轉為 Assembly

**3 組譯**
- Assembly → 機器碼 → Object File

**4 連結**
- 將 Object Files 合併，解析符號，產生執行檔

----

## 編譯指令

```bash
# 前往檔案目錄
cd [address]

# 編譯並執行（a.out 為預設輸出名）
g++ name.cpp && ./a.out

# 自訂輸出檔名
g++ -o myprogram name.cpp
```

----

# Part 3
## 前處理器 Preprocessor

----

## 常用 Preprocessor 指令

| 指令 | 用途 |
|------|------|
| `#include` | 引入 header 檔 |
| `#define` | 定義常數或簡易 function |
| `#undef` | 取消 `#define` |
| `#if / #elif / #else` | 條件式編譯 |

----

## `#define` 用法

```cpp
// 定義常數
#define PI 3.14

// 定義簡易 function（注意：無型別定義！）
#define multiply(a1, a2) (a1 * a2)
```

 `#define` 的 function 不嚴謹，沒有型別檢查

----

## `#include` 用法

```cpp
// 引入標準函式庫 header（用角括號）
#include <iostream>
#include <algorithm>

// 引入自訂 header（用雙引號 + 路徑）
#include "usr/lib/head.h"
```

----

<!-- .slide: data-background="#1a1a2e" -->

##  思考題

> `#define multiply(a, b) (a * b)` 這樣定義有什麼潛在問題？  
> 試想：`multiply(1+2, 3)` 會得到什麼結果？

<br>

*提示：preprocessor 只做文字替換！*

----

*答案：`multiply(1+2, 3) 會因為巨集單純文字替換而展開成 (1 + 2 * 3)，導致運算子優先級錯誤，最終得到結果 7（而非預期的 9）。`*

## 拆解架構

**1 `#include <iostream>`**
- 告訴前處理器引入 `iostream` header
- 包含基本輸出入（`cout`, `cin`）

**2 `using namespace std;`**
- 使用標準命名空間
- 省去每次寫 `std::cout` 的麻煩

----

**3 `int main()`**
- 程式的主體，OS 呼叫的入口
- `int` 代表回傳整數型態

**4 `return 0;`**
- 回傳給 OS，`0` 表示程式正常結束

----

## 註解 Comments

```cpp
// 單行註解：此行不會被編譯

/* 多行註解
 * 這裡的內容全部無效
 * 通常加 * 對齊並標示
 */
```

    cout << "D" << endl;
    return 0;
}
```

**輸出是什麼？**

# Part 6
## 變數與資料型態

----

## 為什麼需要型態？

> 電腦資源有限，需要依資料性質分配空間

把變數想像成**不同大小的盒子**：
- 盒子大小 = 記憶體空間（位元數）
- 硬塞 = **overflow 溢位** 
- 貼標籤 = 變數名稱（識別字）

----

## 整數型態

| 型態 | 位元 | 範圍 |
|------|------|------|
| `short int` | 2 | -32768 ~ 32767 |
| `int` | 4 | -2,147,483,648 ~ 2,147,483,647 |
| `long int` | 4 | 同 int |
| `long long` | 8 | ±9.2 × 10¹⁸ |
| `unsigned int` | 4 | 0 ~ 4,294,967,295 |

----

## 浮點數與其他型態

| 型態 | 位元 | 說明 |
|------|------|------|
| `float` | 4 | 單精度浮點數 |
| `double` | 8 | 雙精度浮點數（常用） |
| `char` | 1 | 字元，存 ASCII 碼 |
| `bool` | 1 | `true` / `false` |

----

## 變數宣告

```cpp
// 只宣告，不賦值
int a, b, c;

// 宣告並賦值
int x = 10;
double pi = 3.14159;

// 混合
int a, b = 33, c;
```

----

## 各型態範例

```cpp
bool flag = true;         // 布林值
int count = 100;          // 整數
long long big = 1234567890123LL;  // 大整數
float f = 22.0f;          // 單精度浮點
double d = 3.14159265;    // 雙精度浮點
char c = 'A';             // 字元
char newline = '\n';      // 跳脫字元
```

----

## 跳脫字元 Escape Sequence

| 跳脫序列 | 意義 |
|----------|------|
| `\n` | 換行 |
| `\t` | Tab 跳格 |
| `\a` | 警告音 |
| `\0` | 字串結束字元 |
| `\\` | 反斜線 `\` |
| `\"` | 雙引號 `"` |

----

## 變數命名原則

Y **好的命名**
```cpp
int exam_score;
double total_price;
bool is_valid;
```

N **不好的命名**
```cpp
int 1score;      // 數字開頭
int exam score;  // 有空格
int __value;     // 雙底線開頭（程式庫保留）
```

----

# Part 7
## 運算式 Expression

----

## 組成

```
運算式 = 運算元 (operand) + 運算子 (operator)
```

三種形式：
```cpp
operand1;                          // 單一運算元
operand1 operator operand2;        // 二元
condition ? expr1 : expr2;         // 條件運算
```

## 算術運算子

| 優先 | 運算子 | 功能 | 範例 |
|------|--------|------|------|
| 1 | `+` `-` | 正負號 | `-a` |
| 2 | `*` `/` `%` | 乘除取餘 | `a * b` |
| 3 | `+` `-` | 加減 | `a + b` |

> 全數**左結合**（由左至右）

##  整數除法陷阱

```cpp
int a = 1, b = 3;
cout << a / b;         // 輸出 0（整數除法捨去）

float a = 1, b = 3;
cout << a / b;         // 輸出 0.333333

// 強制型別轉換
int a = 1, b = 3;
cout << (float)a / b;  // 輸出 0.333333
```

##  程式碼猜輸出

```cpp
int a = 1, b = 3;
cout << float(a/b) << endl;
cout << (float)a/b << endl;
```

**兩行輸出一樣嗎？為什麼？**

----

 答案：  
 第一行：`0`（先算 `1/3=0`，再轉 float）  
 第二行：`0.333333`（`a` 先轉 float，再除）

## 遞增遞減運算子

| 寫法 | 行為 |
|------|------|
| `++a` | 先加 1，再使用值 |
| `a++` | 先使用值，再加 1 |
| `--a` | 先減 1，再使用值 |
| `a--` | 先使用值，再減 1 |

```cpp
int b = 10;
cout << 10 * (++b);   // 輸出 110（b先變11，再乘10）
```

## 邏輯與關係運算子

| 優先 | 運算子 | 說明 |
|------|--------|------|
| 1 | `!` | 邏輯 NOT |
| 2 | `>` `<` `>=` `<=` | 大小比較 |
| 3 | `==` `!=` | 相等/不等 |
| 4 | `&&` | 邏輯 AND |
| 5 | `\|\|` | 邏輯 OR |

>  `=` 是指派；`==` 才是比較！

## Short-circuit Evaluation 短路運算

```cpp
// && ：左邊為 false → 右邊不執行
false && someFunction();  // someFunction() 不被呼叫

// || ：左邊為 true → 右邊不執行
true || someFunction();   // someFunction() 不被呼叫
```

----

## 複合指派運算子

```cpp
a += 1;    // 等同 a = a + 1
b -= a;    // 等同 b = b - a
c *= a;    // 等同 c = c * a
d /= 1000; // 等同 d = d / 1000
e %= 3;    // 等同 e = e % 3
```

----

## 條件運算子（三元）

```cpp
// 語法
condition ? expr_if_true : expr_if_false;

// 範例
int score = 60;
cout << (score > 60 ? "pass" : "fail");
// 輸出：fail
```

##  思考題

> 以下程式碼中，`someFunction()` 會被執行嗎？  
> 說明你的理由。

```cpp
int x = 5;
if (x > 3 || someFunction()) {
    cout << "yes";
}
```

----

 答案：**不會**。`x > 3` 為 true，  
 `||` 短路，右邊不執行。

**Q: `year = 1900`，以上程式碼輸出什麼？**

A. 1900年是閏年(400倍數)  
B. 1900年非閏年(100年) 
C. 1900年是閏年(非100倍數4倍數)  
D. 1900年非閏年（非4倍數）  

<br>

*（1900 % 4 == 0, 1900 % 100 == 0, 但 1900 % 400 ≠ 0）*
