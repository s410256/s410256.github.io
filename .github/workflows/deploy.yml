name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # 每 30 分鐘自動啟動爬蟲與更新網站
    - cron: '*/30 * * * *'
  workflow_dispatch: # 支援在 GitHub 介面手動點擊觸發

# 開啟儲存庫寫入權限 (自動 commit data.json) 與 Pages 部署權限
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝必要套件
        run: pip install requests urllib3

      - name: 4. 執行爬蟲與構建靜態檔案
        run: python build.py

      - name: 5. 若有新公告，將更新後的 data.json 推送回儲存庫
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git diff-index --quiet HEAD || (git commit -m "chore: 自動更新公告資料庫 [skip ci]" && git push)

      - name: 6. 上傳 dist/ 資料夾至 GitHub Pages 靜態伺服器
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: 7. 發布部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4